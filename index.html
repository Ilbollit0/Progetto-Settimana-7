<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportsHub — Settimana VII Week Project</title>
    <!-- Bootstrap 5: griglia responsive e componenti (card, alert, spinner, list-group) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Il nostro CSS dopo Bootstrap: a parità di specificità vince l'ultimo caricato -->
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>

    <header class="site-header text-white py-4 mb-4">
      <div class="container">
        <h1 class="display-6 fw-bold mb-1">SportsHub</h1>
        <p class="mb-0 opacity-75">Cerca una squadra e scopri prossime partite e ultimi risultati.</p>
      </div>
    </header>

    <main class="container pb-5">

      <!-- === Ricerca squadre === -->
      <section class="card shadow-sm mb-4" aria-labelledby="titolo-ricerca">
        <div class="card-body">
          <h2 id="titolo-ricerca" class="h4">Cerca una squadra</h2>

          <!-- Su mobile input e bottone vanno uno sotto l'altro (col-12),
               da "sm" in su stanno sulla stessa riga (col-sm / col-sm-auto) -->
          <form id="form-ricerca" class="row g-2" role="search">
            <div class="col-12 col-sm">
              <label for="cerca" class="visually-hidden">Nome della squadra</label>
              <input type="search" id="cerca" name="cerca" class="form-control"
                     placeholder="es. Arsenal, Juventus..." autocomplete="off" required>
            </div>
            <div class="col-12 col-sm-auto">
              <button type="submit" class="btn btn-primary w-100">Cerca</button>
            </div>
          </form>

          <!-- Stati visivi: nascosti con "hidden", li mostrerà il JavaScript -->
          <div id="spinner-ricerca" class="d-flex align-items-center gap-2 mt-3" hidden>
            <div class="spinner-border spinner-border-sm text-primary" aria-hidden="true"></div>
            <span role="status">Caricamento in corso...</span>
          </div>
          <div id="errore-ricerca" class="alert alert-danger mt-3 mb-0" role="alert" hidden></div>
        </div>
      </section>

      <!-- === Lista squadre ===
           Griglia: 1 colonna su mobile, 2 su tablet (md), 3 su desktop (lg), 4 su schermi larghi (xl).
           Parte vuota: nessuna squadra predefinita, le card arrivano dopo la ricerca. -->
      <section class="mb-5" aria-label="Risultati della ricerca">
        <div id="risultati" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-3" aria-live="polite">
          <!-- card create da JavaScript -->
        </div>
      </section>

      <!-- === Dettagli squadra: compare dopo il click su una card === -->
      <section id="dettagli-section" class="card shadow-sm" aria-labelledby="dettagli-titolo" hidden>
        <div class="card-body">
          <h2 id="dettagli-titolo" class="h4 mb-3"><!-- logo + nome della squadra --></h2>

          <div id="spinner-dettagli" class="d-flex align-items-center gap-2 mb-3" hidden>
            <div class="spinner-border spinner-border-sm text-primary" aria-hidden="true"></div>
            <span role="status">Caricamento eventi...</span>
          </div>
          <div id="errore-dettagli" class="alert alert-danger" role="alert" hidden></div>

          <!-- Due liste affiancate da tablet in su, una sotto l'altra su mobile -->
          <div class="row g-4">
            <div class="col-12 col-md-6">
              <h3 class="h5">Prossimi eventi</h3>
              <ul id="prossimi" class="list-group"></ul>
            </div>
            <div class="col-12 col-md-6">
              <h3 class="h5">Ultimi risultati</h3>
              <ul id="ultimi" class="list-group"></ul>
            </div>
          </div>
        </div>
      </section>

    </main>

  </body>
</html>
